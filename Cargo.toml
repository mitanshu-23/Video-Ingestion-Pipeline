[package]
name = "videoIngestionPipeline"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
axum-prometheus = "0.10.0"
base64 = "0.22.1"
dotenv = "0.15.0"
futures-util = "0.3.32"
lazy_static = "1.5.0"
log = "0.4.29"
log4rs = "1.4.0"
once_cell = "1.21.4"
prometheus = { version = "0.14", features = ["process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1.0", features = ["v4", "v7", "fast-rng"] }
infer = "0.19.0"                                                # Or the latest version available
